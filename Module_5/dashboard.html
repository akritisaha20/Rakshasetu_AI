<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RakshaSetu — Family Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAF6EF;
    --paper: #FFFFFF;
    --ink: #2B2A28;
    --muted: #8A8479;
    --calm: #5B7A6D;
    --calm-soft: #E5EDE9;
    --gold: #C9A227;
    --alert: #B33A3A;
    --alert-soft: #FBEAEA;
    --line: #E7E1D6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    transition: background 0.6s ease;
  }

  body.alert-active {
    background: #FDF3F3;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-name {
    font-family: 'Fraunces', serif;
    font-size: 20px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  .brand-sub {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* The presence dot -- the signature element */
  .presence {
    position: relative;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--calm);
    flex-shrink: 0;
  }

  .presence::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: var(--calm);
    opacity: 0.35;
    animation: breathe 3.2s ease-in-out infinite;
  }

  body.alert-active .presence,
  body.alert-active .presence::before {
    background: var(--alert);
  }

  body.alert-active .presence::before {
    animation: pulse-alert 1s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.85); opacity: 0.25; }
    50% { transform: scale(1.35); opacity: 0.5; }
  }

  @keyframes pulse-alert {
    0%, 100% { transform: scale(0.9); opacity: 0.4; }
    50% { transform: scale(1.6); opacity: 0.75; }
  }

  .headline-card {
    background: var(--paper);
    border-radius: 20px;
    padding: 40px 36px;
    border: 1px solid var(--line);
    margin-bottom: 32px;
  }

  body.alert-active .headline-card {
    background: var(--alert-soft);
    border-color: #E8C4C4;
  }

  .eyebrow {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--calm);
    font-weight: 600;
    margin-bottom: 14px;
  }

  body.alert-active .eyebrow { color: var(--alert); }

  .headline {
    font-family: 'Fraunces', serif;
    font-size: 30px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 12px;
  }

  .sub-headline {
    color: var(--muted);
    font-size: 15px;
    margin: 0;
  }

  .sub-headline .mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }

  .action-row {
    margin-top: 24px;
    display: none;
  }

  body.alert-active .action-row { display: block; }

  .btn-live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--alert);
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .stat-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 32px;
  }

  .stat {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px 20px;
  }

  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 600;
  }

  .stat-value.accessibility { color: var(--gold); }

  .log-section-title {
    font-family: 'Fraunces', serif;
    font-size: 17px;
    font-weight: 500;
    margin: 0 0 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .log-section-sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 18px;
  }

  .log-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent 65%);
    margin-bottom: 18px;
  }

  .log-entry {
    display: flex;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 14px;
  }

  .log-entry:last-child { border-bottom: none; }

  .log-time {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    padding-top: 1px;
    min-width: 64px;
  }

  .log-text { color: var(--ink); }

  .log-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 8px;
    background: var(--calm-soft);
    color: var(--calm);
  }

  .log-badge.alert { background: var(--alert-soft); color: var(--alert); }
  .log-badge.accessibility { background: #FBF3DC; color: #8A6D14; }

  .empty-state {
    color: var(--muted);
    font-size: 14px;
    padding: 24px 0;
    text-align: center;
  }

  footer {
    margin-top: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="presence" id="presenceDot"></div>
        <div>
          <div class="brand-name">RakshaSetu</div>
          <div class="brand-sub">Family Check-In</div>
        </div>
      </div>
    </header>

    <div class="headline-card" id="headlineCard">
      <div class="eyebrow" id="eyebrow">All calm</div>
      <h1 class="headline" id="headline">Everything looks good right now.</h1>
      <p class="sub-headline" id="subHeadline">
        Last update <span class="mono" id="lastUpdate">—</span>
      </p>
      <div class="action-row">
        <button class="btn-live">● View live feed</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat">
        <div class="stat-label">Current activity</div>
        <div class="stat-value" id="modeValue">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Battery</div>
        <div class="stat-value" id="batteryValue">—</div>
      </div>
    </div>

    <div class="log-section-title">Recent moments</div>
    <p class="log-section-sub">What's happened in the last few minutes</p>
    <div class="log-divider"></div>
    <div id="logList">
      <div class="empty-state">Waiting for the first update…</div>
    </div>

    <footer>Reading live from Module 4 · updates every 2 seconds</footer>
  </div>

<script>
const TWIN_URL = "http://localhost:5001/digital_twin";
const LOGS_URL = "http://localhost:5001/logs";

function describeState(mode, accessibilityMode, hazardType, gesture) {
  if (mode === "SAFETY_ALERT") {
    return {
      eyebrow: "Needs attention",
      headline: "We noticed a sharp movement and haven't heard back.",
      sub: "The robot has paused and is waiting for a response."
    };
  }
  if (mode === "ACCESSIBILITY" && accessibilityMode === "VISION_IMPAIRED") {
    return {
      eyebrow: "Moving carefully",
      headline: `Navigating slowly around ${hazardType || "something"} in the path.`,
      sub: "Speed reduced automatically for safety."
    };
  }
  if (mode === "ACCESSIBILITY" && accessibilityMode === "HEARING_IMPAIRED") {
    return {
      eyebrow: "Visual mode",
      headline: "Switched to large text — a sign or gesture was used.",
      sub: "Communicating visually instead of by voice."
    };
  }
  return {
    eyebrow: "All calm",
    headline: "Everything looks good right now.",
    sub: "Just keeping company, as usual."
  };
}

function formatTime(unixSeconds) {
  const d = new Date(unixSeconds * 1000);
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function describeLogEntry(entry) {
  if (entry.robot_state === "SAFETY_ALERT") {
    return { text: "Sharp movement detected — checking in", badge: "alert" };
  }
  if (entry.hazard_in_path) {
    return { text: `Noticed ${entry.hazard_type || "an obstacle"} nearby, moving carefully`, badge: "accessibility" };
  }
  if (entry.detected_gesture === "Wave") {
    return { text: "Sign/gesture used — switched to visual display", badge: "accessibility" };
  }
  if (entry.detected_gesture === "Thumbs_Up") {
    return { text: "Thumbs up — confirmed all is well", badge: "calm" };
  }
  return { text: "Quiet moment, nothing unusual", badge: "calm" };
}

async function refresh() {
  try {
    const twinRes = await fetch(TWIN_URL);
    const twin = await twinRes.json();

    const mode = twin.current_mode;
    const isAlert = mode === "SAFETY_ALERT";
    document.body.classList.toggle("alert-active", isAlert);

    const raw = twin.raw_telemetry || {};
    const desc = describeState(mode, twin.accessibility_mode, raw.hazard_type, raw.detected_gesture);

    document.getElementById("eyebrow").textContent = desc.eyebrow;
    document.getElementById("headline").textContent = desc.headline;
    document.getElementById("subHeadline").innerHTML =
      `Last update <span class="mono">${formatTime(twin.last_updated)}</span> — ${desc.sub}`;
    document.getElementById("modeValue").textContent = mode || "—";
    document.getElementById("batteryValue").textContent = (twin.battery_level ?? "—") + "%";

    const logsRes = await fetch(LOGS_URL);
    const logs = await logsRes.json();
    const logList = document.getElementById("logList");

    if (!logs.length) {
      logList.innerHTML = '<div class="empty-state">Waiting for the first update…</div>';
    } else {
      logList.innerHTML = logs.map(entry => {
        const d = describeLogEntry(entry);
        return `<div class="log-entry">
          <div class="log-time">${formatTime(entry.timestamp)}</div>
          <div class="log-text">${d.text}<span class="log-badge ${d.badge}">${entry.robot_state}</span></div>
        </div>`;
      }).join("");
    }
  } catch (e) {
    document.getElementById("subHeadline").innerHTML =
      `<span style="color:var(--alert)">Can't reach Module 4 — is it running?</span>`;
  }
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
